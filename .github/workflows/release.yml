name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write      # ghcr.io
  id-token: write      # PyPI trusted publishing (OIDC — sin API token)

jobs:
  version:
    name: tag == pyproject.version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          [ "$TAG" = "$PKG" ] || {
            echo "::error::tag v$TAG != pyproject version $PKG"
            exit 1
          }

  docker:
    name: imagen OSS → ghcr.io
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    name: wheel → PyPI (nous-memory)
    runs-on: ubuntu-latest
    needs: version
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry==1.8.4 && poetry build
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing OIDC — requiere el "pending publisher"
        # registrado en PyPI: owner leoquintara, repo nous,
        # workflow release.yml, environment pypi.
