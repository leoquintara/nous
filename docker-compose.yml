services:
  db:
    image: pgvector/pgvector:pg18
    container_name: nous-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOUS_DB_USER:-nous}
      POSTGRES_PASSWORD: ${NOUS_DB_PASSWORD:-nous}
      POSTGRES_DB: ${NOUS_DB_NAME:-nous}
    ports:
      - "5432:5432"
    volumes:
      - nous_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: nous-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NOUS_DATABASE_URL: postgresql+asyncpg://${NOUS_DB_USER:-nous}:${NOUS_DB_PASSWORD:-nous}@db:5432/${NOUS_DB_NAME:-nous}
    ports:
      - "8720:8720"
    profiles: ["app"]

volumes:
  nous_pgdata:
